# Track 1: classical 2D baseline (keypoint inside hold box for a minimum duration).
# Defaults below are starting values; tune them on LOPO training folds only.

pose_version: rtmw-x-384_2026-11-18   # folder under paths.interim.pose2d
keypoints: wrist_ankle                 # or: fingertip_toe (variant, needs a coco_wholebody133 pose version)

# Keypoint confidence below which a frame counts as missing. Scales differ per model
# (docs/pose2d_format.md), so thresholds are keyed by pose model name prefix.
min_score:
  rtmw: 1.5            # SimCC confidence; ~5th percentile of wrist scores on The Way Up
  vitpose: 0.3         # heatmap maximum, 0-1

smoothing:
  method: median       # gaussian | median | none
  window: 5            # frames
  max_gap: 5           # longest run of missing frames that is linearly interpolated

distance_px: 0         # contact if keypoint-to-box distance <= this (0 = inside the box)
assign: nearest        # nearest: one hold per limb and frame | all: every box containing the point
min_duration_s: 0.5    # The Way Up rule: contact must last at least 0.5 s
merge_gap_frames: 2    # merge contact runs separated by at most this many frames before the duration check

# LOPO tuning (scripts/tune_track1.py): every combination is scored on the training participants
# of each fold; the best one is applied to the held-out participant.
tuning:
  objective: mean_f1            # mean F1 over the tIoU thresholds in configs/eval.yaml, or f1@0.5
  grid:
    distance_px: [0, 10, 20]
    min_duration_s: [0.3, 0.5, 0.8]
    merge_gap_frames: [0, 5]
    smoothing.window: [1, 5, 9]
  min_score_grid:               # keyed by pose model prefix like min_score
    rtmw: [1.0, 1.5, 2.0, 2.5]
    vitpose: [0.2, 0.3, 0.5]
