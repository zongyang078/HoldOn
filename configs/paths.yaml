# Filesystem locations. Each member edits this file (or a local copy) to match their machine.
data_root: data
raw:
  wayup: data/raw/wayup
  kilter: data/raw/kilter
interim:
  pose2d: data/interim/pose2d   # 2D keypoints (external/pose2d), one version folder per run
  wham: data/interim/wham       # raw WHAM outputs (external/wham), Track 3 internal
processed:
  distance3d: data/processed/distance3d   # Track 3 limb-to-hold distances (docs/interfaces.md)
  features: data/processed/features
checkpoints: checkpoints
results: results


# Shared archive on the team Google Drive (see README "Getting the data").
shared:
  wayup_zip_sha256: d7215ab006eb6b834f0196a865836e39efea1497d20a95efb5bda4f04bb0e540

# Official data versions every track uses (folder names under the paths above, same on the Drive).
# Change only together with a note in the PR; results must name the versions they used.
versions:
  pose2d: rtmw-x-384_2026-11-18             # RTMW whole-body, 133 keypoints (main pose input)
  pose2d_vitpose: vitpose-plus-huge_2026-11-18  # ViTPose++-H, 17 keypoints (paper comparison only)
  distance3d: null                          # set by Track 3 once the first version is on the Drive
