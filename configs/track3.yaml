# Track 3: 3D pipeline (owner: 3D line). WHAM body + wall pose from the bolt-hole homography.
# Camera: intrinsics are unknown. One focal length for all videos, fitted to the bolt holes
# (scripts/wall_pose.py, results/tables/track3_wall_pose.md); principal point = image centre.
# WHAM must run with the same value (external/wham/run_wham.py reads it from here).
focal_length_px: 590
fallback_2p5d: false         # true = distances in the wall plane (method "2.5d" in docs/interfaces.md)

# Contact rule applied to the distance files (holdon.models.rules.events_from_distances),
# same structure as Track 1 so the tracks are comparable. Tune on LOPO training folds only.
distance_threshold_m: 0.05
assign: nearest
min_duration_s: 0.5
merge_gap_frames: 2
