# Track 2: learned temporal classifier.
features:                    # toggle for ablation
  overlap2d: true
  stillness: true
  distance3d: true
model: gru                   # svm | gru | cnn1d
window_frames: 25
train:
  epochs: 30
  batch_size: 64
  lr: 1.0e-3
  seed: 0
decoding:
  threshold: 0.5
  min_duration_frames: 5
